     ═══════════════════════════════════════════════════════════════════════════

     Общие правила:
     - сброса стилей в проекте нет и не будет; каждый элемент секции задаёт свои
       margin, padding, list-style, text-decoration явно, через собственный класс sw-*;
     - var() всегда со вторым аргументом, значения фолбэков — из design_system.md
       раздел 2, без отсебятины;
     - в @media — литеральные px, var() там не работает;
     - общего класса контейнера нет, контейнер описывается внутри каждой секции.

     Правила работы со SplitText (действуют во всех секциях):
     - сплит применяется только к тексту внутри секции; и целевой элемент, и все
       сгенерированные плагином узлы остаются внутри её контейнера;
     - имена сгенерированных классов задаются явно через linesClass / wordsClass /
       charsClass с префиксом секции (sw-header__nav-char). Дефолтные имена плагина
       не использовать: они не под нашим контролем и не проходят правило именования;
     - секция перед вызовом проверяет window.gsap и window.SplitText и тихо ничего
       не делает, если их нет;
     - сплит по строкам запускается после готовности шрифта (document.fonts.ready)
       либо с autoSplit: true. При font-display: swap строки, посчитанные на
       фолбэк-шрифте, разъедутся в момент подмены на Inter;
     - на интерактивных элементах (<a>, <button>) параметр aria задаётся явно,
       дефолт не оставлять;
     - обработчики событий вешаются на сам <a>, а не на сгенерированные узлы:
       при ре-сплите узлы пересоздаются и слушатели на них умирают;
     - hover-эффекты живут только под (hover: hover) и (min-width: 769px)
       в gsap.matchMedia(); при prefers-reduced-motion: reduce сплит не запускается.
     ═══════════════════════════════════════════════════════════════════════════ -->

<style>
/* стиль — секция GlobalHeader */

/* box-sizing — посекционно, первой строкой. Потомковый * не выходит за контейнер. */
.sw-header,
.sw-header *,
.sw-header *::before,
.sw-header *::after { box-sizing: border-box; }

/* ─────────────────────────────────────────────────────────────────────────────
   ДВЕ ГРАНИЦЫ, ПРИРОДА РАЗНАЯ, СМЕШИВАТЬ НЕЛЬЗЯ.
   768 — метрическая: ≤768 значения фиксированы, ≥769 клампятся. К ней же
   привязаны автоскрытие (≤768 панель не уезжает), тач-минимум 44px, а также
   состав левой части панели: ≤768 меню скрыто и стоит бургер, ≥769 наоборот.
   1200 — композиционная, действует только внутри SEC-2 и только в правой
   зоне: с неё появляются текстовый номер и вторичная ссылка, а плашка
   телефона уходит из пилюли. Меню и бургер к этой границе отношения не имеют.
   var() в @media не работает — границы литеральные.

   Состав по диапазонам:
   ≤768        логотип + пилюля из трёх плашек + бургер;
   769–1199    логотип + меню + пилюля из трёх плашек;
   ≥1200       логотип + меню + блок номера + пилюля из двух плашек.

   АНКЕРЫ КЛАМПОВ. Элемент, живущий на всех ширинах, клампится от 768
   (логотип, высота панели, зазоры от краёв, плашки). Элемент, появляющийся
   на 769, клампится от 769 (кегль пункта меню, зазоры вокруг меню). Элемент,
   появляющийся на 1200, клампится от 1200 (кегли номера и вторичной ссылки,
   зазор «номер ↔ пилюля»). Анкер — это ширина, на которой значение равно
   нижней границе клампа; смешивать анкеры в одном диапазоне нельзя, иначе
   рампа стартует не с той величины и состав перестаёт помещаться.
   ───────────────────────────────────────────────────────────────────────────── */

/* Контейнер секции. Фиксирован нашим CSS (у T123 настройки «зафиксировать блок»
   нет), слой --sw-z-sticky. Сам прозрачен и кликов не перехватывает: зазоры
   вокруг панели иначе перекрыли бы соседнюю секцию. Клики принимает только панель.
   padding контейнера и есть зазоры от краёв вьюпорта: верх / бока / низ. */
.sw-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: var(--sw-z-sticky, 100);
  padding: 0 15px 8px;
  font-family: var(--sw-font-family, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif);
  font-size: var(--sw-fs-body, 1rem);
  line-height: var(--sw-lh-body, 1.6);
  color: var(--sw-color-text, #242424);
  pointer-events: none;
}

/* Панель: скруглена снизу, обводка 1px, тени нет.
   Раскладка здесь описана для компактного состава — флекс-строка: логотип,
   контакты, прижатые auto-полем, бургер. С 769 состав другой и раскладка
   другая, грид: см. блок «769px и выше».
   Радиус рваный, три ступени: 46 / 26 / 14, границы 1024 и 375. Сами ступени
   объявлены токеном в ЗОНЕ A, здесь важен фолбэк — он ступенями не выражается,
   поэтому у каждой ступени свой: 46 здесь, 26 в блоке ≤1024, 14 в блоке ≤375.
   Уедет секция в Тильду раньше токенов — радиус всё равно будет верным на всех
   ширинах. Три блока радиуса повторяют структуру объявления токена один в один
   (базовое правило плюс два max-width): при любом другом раскладе на дробных
   ширинах от масштабирования фолбэк и токен разошлись бы.
   Вход и автоскрытие — разные по природе движения, значения не общие:
   вход односторонний, поэтому --sw-dur-entrance и --sw-ease-out (design_system 2.6:
   эта кривая держится именно под появление элементов);
   автоскрытие двустороннее — там остаются --sw-dur-slow и --sw-ease-in-out.
   Вход — @keyframes без fill: forwards, иначе залитый анимацией transform
   перебил бы transition автоскрытия. */
.sw-header__bar {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  height: 72px;
  padding: 0 clamp(16px, 3.56vw + 2.64px, 30px);
  background: var(--sw-color-bg-section, #FFFFFF);
  border: 1px solid var(--sw-color-bg-page, #F4F5F5);
  border-radius: 0 0 var(--sw-radius-lg, 46px) var(--sw-radius-lg, 46px);
  pointer-events: auto;
  transition: transform var(--sw-dur-slow, 400ms) var(--sw-ease-in-out, cubic-bezier(0.65, 0, 0.35, 1));
  animation: sw-header-slide-in var(--sw-dur-entrance, 700ms) var(--sw-ease-out, cubic-bezier(0.22, 1, 0.36, 1));
}

.sw-header__bar--hidden { transform: translateY(-100%); }

/* Снимает вход, когда страница открылась уже прокрученной: браузер восстанавливает
   позицию скролла, и панель проигрывала бы выезд сверху на глубине в тысячи
   пикселей. Класс ставит поведение секции; панель при этом остаётся видимой. */
.sw-header__bar--no-entrance { animation: none; }

@keyframes sw-header-slide-in { from { transform: translateY(-100%); } }

/* ─── логотип ─── */
/* max-width + object-fit: contain — предохранитель: логотип уменьшается сам,
   сохраняя пропорцию, вместо того чтобы вытолкнуть соседей за пределы панели

.sw-header__plate::before {

     Отказ по ширине приходит в колонку 1fr: она садится на свой минимум,

  .sw-header__bar {

  .sw-header__burger { display: none; }

<!-- ═══════ T123 · СЕКЦИЯ: Hero (SEC-1) — начало ═══════ -->
<style>
/* стиль — секция Hero */

/* box-sizing — посекционно, первой строкой. Потомковый * не выходит за контейнер. */
.sw-hero,
.sw-hero *,
.sw-hero *::before,
.sw-hero *::after { box-sizing: border-box; }

/* ─────────────────────────────────────────────────────────────────────────────
   ГРАНИЦЫ СЕКЦИИ. Их четыре, природа разная.
   768 — проектная метрическая: ≤768 значения фиксированы, ≥769 клампятся. На ней
   же перестраивается раскладка (строка → колонка) и кнопка уходит из панели
   в видео-блок.
   425 — вводится этой секцией и только для цветов кнопки в покое. Геометрия,
   позиция и кегль на ней не меняются.
   1024 и 375 — не наши: это границы токена --sw-radius-lg (design_system 2.4),
   единого скругления всех секций проекта. Радиус переключается сам по себе,
   состав и метрики секции на них не трогаются.
   var() в @media не работает — границы литеральные.

   ПРАВИЛО РАЗМЕРОВ — ПРОПОРЦИЯ, А НЕ ИНТЕРПОЛЯЦИЯ. Кегли и ширины заданы чистой
   долей вьюпорта: clamp(минимум, X vw, максимум), свободного члена вида A*vw + B
   нет ни в одном значении. Прежняя схема «значение на 769 равно значению на 768,
   между 769 и 2560 линейно» отменена: ниже 768 величины не замораживаются, а
   продолжают уменьшаться по той же доле до собственных минимумов. Поэтому клампы
   стоят по обе стороны границы, а не только в блоке min-width: 769px.
   Разрыв кегля заголовка на границе (38 → 23,5px) намеренный: на 769 панель
   становится половиной вьюпорта, и доля обязана смениться.
   Ступенчатых значений два, они интерполяции не подчиняются вовсе: радиус частей
   и радиус кнопки.

   ШИРИНА ТЕКСТОВЫХ БЛОКОВ — В EM. При пропорциональном кегле em привязывает
   максимальную ширину к самому кеглю, и разбивка на строки перестаёт зависеть от
   ширины экрана: 3 строки заголовка на ≥769, 2 на ≤768, 2 строки подзаголовка
   везде. В px или % то же самое пришлось бы пересчитывать на каждой ширине.

   ВЫСОТНОЙ СИСТЕМЫ НЕТ. Пределы в svh и конструкция min(ширинный clamp,
   высотный предел) не применяются: опорные высоты вьюпорта были расчётными,
   а не замеренными, и на реальном устройстве система разъезжалась. Единственное
   место, где svh остался, — min-height самой секции.
   Нижний порог высоты кнопки на ≥769 равен 44px — это тач-минимум, а не
   декоративная величина, и снимать его нельзя.

   ВЫСОТА СЕКЦИИ — НЕ ЖЁСТКАЯ. min-height: 100svh, не height: секция обязана
   вытягиваться, когда контент не помещается (телефон в альбомной ориентации),
   а не обрезать его. Из этого следует вся цепочка ниже: секция — флекс-колонка,
   раскладка внутри неё flex: 1 0 auto (растёт до свободного места, но никогда
   не сжимается ниже собственного контента), а строки грида — 1fr, то есть
   minmax(auto, 1fr): их минимум равен содержимому, и при нехватке места они
   тянут вверх всю секцию вместо того, чтобы обрезать панель.
   ───────────────────────────────────────────────────────────────────────────── */

/* ─── секция ─── */
/* Высота НЕ МЕНЬШЕ 100svh: box-sizing: border-box, поэтому верхняя компенсация
   шапки и нижний зазор до следующей секции входят внутрь этой высоты, а не
   прибавляются к ней. min-height, а не height: когда контент не помещается,
   секция вытягивается, а не обрезает его. Фолбэк 100vh строкой выше — Safari
   до 15.4 не знает svh.
   Флекс-колонка нужна, чтобы раскладка получила высоту от секции: процент
   высоты от родителя с одним лишь min-height не разрешается, а flex: 1 0 auto
   у раскладки решает и это, и растяжку.
   Верхний padding = высота панели шапки + её нижний зазор. Шапка position: fixed
   и места в потоке не занимает, компенсировать её обязана Hero (design_system
   2.8). Обе формулы взяты из GlobalHeader дословно — при их правке правятся обе
   точки.
   Собственного фона у секции нет: фон страницы виден по периметру и в зазоре
   между частями. В Тильде фон страницы задаётся в настройках страницы, не кодом. */
.sw-hero {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100svh;
  padding: 80px 15px 14px;
  font-family: var(--sw-font-family, 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif);
  font-size: var(--sw-fs-body, 1rem);
  line-height: var(--sw-lh-body, 1.6);
  color: var(--sw-color-text, #242424);
}

/* ─── раскладка ─── */
/* Две равные части: ≤768 друг под другом и равные по высоте, ≥769 в строку и
   равные по ширине. Ширина и высота частей — производные от вьюпорта, числом
   не задаются нигде.
   ГРИД, А НЕ ФЛЕКС. Флексом две равные части здесь не получаются: у панели есть
   горизонтальный padding, у видео-блока его нет. При box-sizing: border-box
   базис 0 трактуется как нулевой border-box, и padding прибавляется к нему
   сверху — панель выходила шире на весь свой padding (замер на 2560: 1318
   против 1130). Базис 50% чинит это лишь частично: отрицательное свободное
   место, равное зазору, браузер делит пропорционально ВНУТРЕННИМ базисам,
   а у панели он меньше на тот же padding — оставалось расхождение 1,4px.
   Точное равенство флексом достижимо только через flex: 0 0 calc(50% - половина
   зазора), то есть половина зазора переезжает во вторую точку правки и молча
   разойдётся с gap при первом же его изменении.
   У грида колонки minmax(0, 1fr) равны по определению, padding элемента на
   ширину трека не влияет, а зазор остаётся объявлен ровно один раз.
   КОЛОНКИ И СТРОКИ РАЗНЫЕ НАМЕРЕННО. Колонки — minmax(0, 1fr): их минимум ноль,
   иначе длинное слово в заголовке распёрло бы колонку и части перестали бы быть
   равными по ширине. Строки — 1fr, то есть minmax(auto, 1fr): их минимум равен
   содержимому. Обе строки при этом всё равно равны между собой — при
   неопределённой высоте контейнера размер fr-единицы берётся как максимум по
   всем гибким трекам, поэтому обе строки получают высоту более высокой части.
   Именно так секция и вытягивается вместо обрезки панели.
   align-items: stretch объявлен явно: он и так дефолт, но это ровно то, чем
   держится равенство частей по высоте в строчной раскладке. */
.sw-hero__layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: 1fr 1fr;
  align-items: stretch;
  gap: 8px;
  flex: 1 0 auto;
}

/* ─── панель ─── */
/* Размер задаёт трек грида, собственного flex/width у части нет.
   min-width: 0 оставлен на самой части: трек уже разрешает себе уйти ниже
   min-content, но элемент внутри трека обязан разрешить это и себе, иначе
   длинное слово в заголовке распрёт часть изнутри.
   min-height: 0 здесь, наоборот, НЕ ставится: высота панели должна доходить до
   трека и тянуть секцию вверх, когда контент не помещается. */
.sw-hero__panel {
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: 0 15px;
  background: var(--sw-color-bg-section, #FFFFFF);
  border: 1px solid var(--sw-color-bg-page, #F4F5F5);
  border-radius: var(--sw-radius-lg, 46px);
}

/* ─── текстовый блок ─── */
/* Группирующая обёртка: разделитель, заголовок и подзаголовок вместе с двумя
   распорками между ними. Собственной максимальной ширины у блока нет — она
   стоит на самих элементах и задана в em. Кнопка в блок не входит: на ≥769 она
   шире (растянута от padding до padding панели), и общего контейнера у них быть
   не может.
   flex-basis: auto здесь обязателен, см. комментарий к распоркам ниже. */
.sw-hero__content {
  display: flex;
  flex: 17 1 auto;
  flex-direction: column;
}

/* ─── распорки вертикального ритма ─── */
/* Ритм пропорциональный: фиксированных отступов нет ни одного, каждый зазор —
   пустая распорка с flex-grow и flex-basis: 0, поэтому при нехватке места все
   они схлопываются до нуля.
   Класс распорки назван по элементу, который идёт ДО неё:
     --top       верх панели → линия
     --divider   линия → заголовок          (внутри текстового блока)
     --title     заголовок → подзаголовок   (внутри текстового блока)
     --subtitle  подзаголовок → кнопка      только ≥769
     --bottom    кнопка → низ панели        ≥769
                 подзаголовок → низ панели  ≤768
   Отношения: 19 / 48 / 50 / 10 / 19 на ≥769 и 7 / 14 / 3 / 17 на ≤768. Выведены
   из замеров 95/240/250/50/95 и 35/70/15/85 — в код идут только отношения,
   пиксели не переносятся. На ≤768 кнопки в панели нет, --subtitle снят,
   и пятый зазор сливается с --bottom.

   ПОЧЕМУ У .sw-hero__content flex-grow РАВЕН СУММЕ ЕГО ВНУТРЕННИХ РАСПОРОК
   (98 = 48 + 50 на ≥769, 17 = 14 + 3 на ≤768), А flex-basis — auto.
   Распорки лежат в двух флекс-контекстах: три в панели, две в текстовом блоке.
   При basis: auto свободное поле панели равно «высота минус текст минус кнопка»,
   текстовый блок забирает из него 98/146 и раздаёт внутри 48 : 50 — то есть
   48/146 и 50/146 от того же поля. Отношения всех пяти зазоров остаются
   точными. С basis: 0 в общий пул попала бы высота самого текста, и все пять
   зазоров уехали бы. */
.sw-hero__spacer { flex: 0 1 0; }

.sw-hero__spacer--top { flex-grow: 7; }
.sw-hero__spacer--divider { flex-grow: 14; }
.sw-hero__spacer--title { flex-grow: 3; }
.sw-hero__spacer--subtitle { display: none; }
.sw-hero__spacer--bottom { flex-grow: 17; }

/* ─── разделительная линия ─── */
/* Декоративная: пустой div без текста, в дереве доступности не участвует,
   aria не задаётся. Не hr (тот несёт роль separator) и не img (рисовать нечего).
   Первый элемент текстового блока; первым ТЕКСТОВЫМ элементом панели остаётся h1.
   Ширина — доля вьюпорта. Предохранителя по ширине панели не требуется: доля
   подобрана так, что линия помещается во внутреннюю ширину панели на всём
   диапазоне, включая обе стороны границы 768/769. */
.sw-hero__divider {
  width: clamp(140px, 45vw, 346px);
  height: 1px;
  margin-inline: auto;
  background: var(--sw-color-surface-muted, #EBEBEB);
}

/* ─── заголовок ─── */
/* Единственная H1 на всю страницу (SEO-1). Двухцветный: цветовая граница
   проходит по слову, а не по строке, поэтому два span на две группы слов.
   Первая группа класса не имеет — берёт цвет самого h1. Принудительных
   переносов нет, <br> не ставится: разбивку задаёт max-width заголовка.
   width: 100% вместе с margin: 0 auto обязателен: автоматические поперечные
   поля отключают растяжку флекс-элемента, и без явной ширины заголовок сел бы
   по содержимому вместо того, чтобы дойти до max-width.
   max-width в em: единица считается от собственного кегля элемента, поэтому при
   пропорциональном кегле ширина строки в знаках держится постоянной, и разбивка
   не зависит от ширины экрана — 3 строки на ≥769, 2 строки на 768.
   Ниже ~700px строк снова 3, но разбивку там задаёт ширина панели, а не
   max-width: заголовок упирается в панель раньше, чем в собственный предел.
   Интерлиньяж — безликое число: множитель к кеглю, а не сумма с ним. */
.sw-hero__title {
  width: 100%;
  max-width: 17em;
  margin: 0 auto;
  padding: 0;
  color: var(--sw-color-text, #242424);
  font-size: clamp(22px, 6.85vw, 38px);
  font-weight: var(--sw-fw-regular, 400);
  line-height: 1.1;
  text-align: center;
}

.sw-hero__title-accent {
  color: var(--sw-color-text-muted, #8F8F8F);
}

/* ─── подзаголовок ─── */
/* max-width одинаков в обоих состояниях: 26em дают 2 строки от 2560 до ~400px,
   ниже — 3 строки. Двухстрочная разбивка требует первой строки в 44 знака,
   это ≈25em; 26em взяты с запасом.
   Нижняя граница клампа кегля — порог читаемости 12px из design_system 2.2, а не
   замер. На 769–1137px подзаголовок стоит на этом минимуме: так и задумано,
   коэффициент доли вьюпорта под него не подгоняется. */
.sw-hero__subtitle {
  width: 100%;
  max-width: 26em;
  margin: 0 auto;
  padding: 0;
  color: var(--sw-color-text-muted, #8F8F8F);
  font-size: clamp(12px, 3.06vw, 17px);
  font-weight: var(--sw-fw-regular, 400);
  line-height: 1.3;
  text-align: center;
}

/* ─── кнопка ─── */
/* Ссылка-якорь в форму. Присутствует в двух экземплярах — внутри панели и
   внутри видео-блока; текст и href идентичны, различаются только модификатором.
   Неактивная в текущем состоянии копия скрыта display: none, поэтому из
   таб-порядка и из дерева доступности выпадает сама: в таб-порядке всегда
   ровно одна кнопка.
   Радиус ступенчатый: 12px на ≤768, 24px на ≥769, между значениями не
   интерполируется. Высота и кегль на ≤768 фиксированы, на ≥769 пропорциональны
   ширине; нижняя граница клампа высоты там равна тач-минимуму 44px.
   Тап-подсветка снята: у кнопки задано собственное активное состояние, и серая
   заливка браузера конфликтовала бы с ним. Тот же приём, что у плашек шапки. */
.sw-hero__cta {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  height: 57px;
  margin: 0;
  padding: 0;
  border-radius: 12px;
  background: var(--sw-color-cta, #242424);
  color: var(--sw-color-text-on-cta, #FFFFFF);
  font-size: 18px;
  font-weight: var(--sw-fw-regular, 400);
  text-align: center;
  text-decoration: none;
  -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  transition: background-color var(--sw-dur-fast, 150ms) var(--sw-ease-standard, cubic-bezier(0.4, 0, 0.2, 1));
}

/* Копия внутри панели живёт с 769: на ≤768 кнопка переносится в видео-блок. */
.sw-hero__cta--panel { display: none; }

/* Копия внутри видео-блока — абсолютом в нижней части, поверх видео.
   Три зазора от краёв блока равны. Последний элемент секции и последнее, что
   видит клиент до скролла. */
.sw-hero__cta--media {
  position: absolute;
  right: 39px;
  bottom: 39px;
  left: 39px;
}

/* ─── видео-блок ─── */
/* Собственного padding не имеет: 39px относятся к посадке кнопки.
   position: relative держит абсолютные видео и кнопку, overflow: hidden обрезает
   видео по скруглению.
   Всё содержимое блока выведено из потока, поэтому собственной высоты у него
   нет и высоту строки грида он не задаёт — её задаёт панель. */
.sw-hero__media {
  position: relative;
  min-width: 0;
  overflow: hidden;
  background: var(--sw-color-bg-section, #FFFFFF);
  border: 1px solid var(--sw-color-bg-page, #F4F5F5);
  border-radius: var(--sw-radius-lg, 46px);
}

/* Соотношения сторон нет: видео и постер обрезаются по cover, размер диктует
   блок.
   Выведено из потока намеренно. В потоке height: 100% при неопределённой высоте
   родителя разрешается в auto, и в расчёт высоты строки грида пошёл бы
   собственный размер видеофайла — блок распёрло бы до сотен пикселей ещё до
   того, как посчитается панель. Абсолютом видео размера не даёт вовсе и просто
   заполняет блок. */
.sw-hero__video {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ─── фокус ─── */
/* Общая обводка секции. Смещение 3px уводит кольцо за пределы кнопки — на
   тёмной заливке оно иначе не читается. */
.sw-hero__cta:focus-visible {
  outline: 2px solid var(--sw-color-focus, #242424);
  outline-offset: 3px;
}

/* ─── hover ─── */
/* Только под (hover: hover) и с 769: на тач-устройстве состояние иначе залипает. */
@media (hover: hover) and (min-width: 769px) {
  .sw-hero__cta:hover { background: var(--sw-color-cta-hover, #0D0D0D); }
}

/* ─── active ─── */
/* Без условия (hover: hover) и на всех ширинах: нажатие обязано давать отклик
   и на телефоне. Цвет текста не меняется и остаётся тем же, что в покое.
   Специфичность выше, чем у блока ≤425 ниже, поэтому порядок правил здесь роли
   не играет. На iOS Safari :active не срабатывает без слушателя касания на
   самом элементе — он вешается в поведении секции. */
.sw-hero__cta:active { background: var(--sw-color-link-hover, #A68A73); }

/* ─── 769px и выше: метрики клампятся, раскладка становится строкой ─── */
@media (min-width: 769px) {
  .sw-hero {
    padding:
      calc(clamp(72px, 4.355vw + 38.51px, 150px) + clamp(8px, 1.787vw - 5.74px, 40px))
      clamp(15px, 1.396vw + 4.26px, 40px)
      clamp(8px, 1.787vw - 5.74px, 40px);
  }

  .sw-hero__layout {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-rows: 1fr;
    gap: 17px;
  }

  .sw-hero__panel {
    padding: 0 clamp(15px, 4.411vw - 18.92px, 94px);
  }

  /* Пятый зазор возвращается: кнопка снова в панели, --subtitle её отделяет
     от подзаголовка. 98 = 48 + 50, сумма внутренних распорок текстового блока,
     см. комментарий к распоркам. */
  .sw-hero__content { flex-grow: 98; }

  .sw-hero__spacer--top { flex-grow: 19; }
  .sw-hero__spacer--divider { flex-grow: 48; }
  .sw-hero__spacer--title { flex-grow: 50; }
  .sw-hero__spacer--bottom { flex-grow: 19; }

  .sw-hero__spacer--subtitle {
    display: block;
    flex-grow: 10;
  }

  .sw-hero__divider { width: min(14.06vw, 360px); }

  .sw-hero__title {
    max-width: 10.4em;
    font-size: clamp(23px, 3.05vw, 78px);
  }

  .sw-hero__subtitle {
    font-size: clamp(12px, 1.055vw, 27px);
  }

  /* Нижняя граница клампа высоты — тач-минимум 44px, не декоративная величина. */
  .sw-hero__cta {
    height: clamp(44px, 4.69vw, 120px);
    border-radius: 24px;
    font-size: clamp(16px, 1.133vw, 29px);
  }

  /* Растянута от padding до padding панели: ширину кнопки задаёт padding
     панели, а не max-width заголовка. */
  .sw-hero__cta--panel {
    display: flex;
    align-self: stretch;
  }

  .sw-hero__cta--media { display: none; }
}

/* ─── 425px и ниже: у кнопки меняются только цвета в покое ─── */
/* Геометрия, позиция и кегль те же. Активное состояние объявлено выше и сюда
   не приходит: цвет текста в нажатии остаётся тем же, что в покое. */
@media (max-width: 425px) {
  .sw-hero__cta {
    background: var(--sw-color-bg-section, #FFFFFF);
    color: var(--sw-color-text, #242424);
  }
}

/* ─── 1024px и ниже: средняя ступень радиуса ─── */
/* Оба блока ниже — про радиус и только про радиус. Границы взяты из объявления
   токена --sw-radius-lg в ЗОНЕ A и повторяют его форму: базовое правило плюс
   два max-width в том же порядке. Ступени в один фолбэк не помещаются, поэтому
   у каждой ступени свой: 46 в базовом правиле, 26 здесь, 14 ниже. Уедет секция
   в Тильду раньше токенов — радиус всё равно будет верным на всех ширинах.
   Между собой эти два блока порядок имеют: на 375 верны оба, и решает
   последний. */
@media (max-width: 1024px) {
  .sw-hero__panel,
  .sw-hero__media { border-radius: var(--sw-radius-lg, 26px); }
}

/* ─── 375px и ниже: нижняя ступень радиуса ─── */
@media (max-width: 375px) {
  .sw-hero__panel,
  .sw-hero__media { border-radius: var(--sw-radius-lg, 14px); }
}

/* ─── prefers-reduced-motion ─── */
/* Анимаций появления и реакций на скролл в секции нет, движение остаётся только
   в смене состояний кнопки. Видео глушится в поведении секции: атрибут autoplay
   через CSS не отменяется. */
@media (prefers-reduced-motion: reduce) {
  .sw-hero__cta { transition: none; }
}
</style>
<!-- разметка — секция Hero -->

    </div>

  </div>

<!-- ═══════ T123 · ИНИЦИАЛИЗАЦИЯ GSAP — ровно один блок на страницу ═══════ -->
<script>
(function () {
  if (!window.gsap) return;
  var plugins = [];
  if (window.ScrollTrigger) plugins.push(window.ScrollTrigger);
  if (window.SplitText) plugins.push(window.SplitText);
  if (plugins.length) gsap.registerPlugin.apply(gsap, plugins);
})();
</script>
<!-- Плагины регистрируются независимо друг от друга: если один не догрузился,
     второй продолжает работать. Общая проверка на оба убила бы регистрацию
     ScrollTrigger из-за одного отсутствующего файла. -->

<!-- ═══════ T123 · ПОВЕДЕНИЕ: GlobalHeader (SEC-2) ═══════ -->
<script>
/* поведение — секция GlobalHeader */
(function () {

  var header = document.querySelector('.sw-header');
  if (!header) return;

  var bar = header.querySelector('.sw-header__bar');

  /* Компактное состояние и reduced-motion — метрическая граница 768,
     та же, что в CSS и что пойдёт в gsap.matchMedia() по VIS-7. */
  var compactMQ = window.matchMedia('(max-width: 768px)');
  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ── 1. Панель: автоскрытие при скролле ──────────────────────────────────
     Движение отдано CSS-переходу: длительность и кривая берутся из токенов
     дословно (--sw-ease-in-out = cubic-bezier(0.65, 0, 0.35, 1); в GSAP этой
     кривой нет без CustomEase, а его в стеке нет). Скрипт только переключает
     класс. Нет GSAP на странице — панель работает по-прежнему.
     На ≤768 и при prefers-reduced-motion панель не уезжает (VIS-7). */
  if (bar) {
    var HIDDEN_CLASS = 'sw-header__bar--hidden';
    var THRESHOLD = 150;   /* порог от верха страницы, px */
    var DELTA = 4;         /* мёртвая зона против дребезга, px */
    var lastY = window.pageYOffset || 0;
    var ticking = false;

    /* Предохранитель входа. Браузер восстанавливает позицию скролла при
       перезагрузке: страница открывается на глубине, а панель проигрывает выезд
       сверху. Ниже порога автоскрытия вход не запускается вовсе — панель сразу
       в конечном положении, видимой. Проверка повторяется по load: восстановление
       позиции происходит позже, чем выполняется этот блок. */
    var dropEntrance = function () {
      if ((window.pageYOffset || 0) > THRESHOLD) bar.classList.add('sw-header__bar--no-entrance');
    };
    dropEntrance();
    window.addEventListener('load', dropEntrance);

    var applyScrollState = function () {
      ticking = false;
      var y = window.pageYOffset || 0;

      if (compactMQ.matches || reduceMQ.matches) {
        bar.classList.remove(HIDDEN_CLASS);
        lastY = y;
        return;
      }

      if (y <= THRESHOLD) bar.classList.remove(HIDDEN_CLASS);
      else if (y - lastY > DELTA) bar.classList.add(HIDDEN_CLASS);
      else if (lastY - y > DELTA) bar.classList.remove(HIDDEN_CLASS);

      lastY = y;
    };

    var onScroll = function () {
      if (ticking) return;
      ticking = true;
      if (window.requestAnimationFrame) window.requestAnimationFrame(applyScrollState);
      else setTimeout(applyScrollState, 16);
    };

    window.addEventListener('scroll', onScroll, { passive: true });

    if (compactMQ.addEventListener) {
      compactMQ.addEventListener('change', applyScrollState);
      reduceMQ.addEventListener('change', applyScrollState);
    }
  }

  /* ── 2. Якоря: плавный переход с компенсацией высоты шапки ────────────────
     scroll-behavior задавался бы по корню документа — это глобальное правило,
     в перенесённом коде запрещено. Компенсация берётся с самого контейнера:
     его высота = панель + нижний зазор, и она уже посчитана браузером.
     Обслуживает пункты меню, логотип и вторичную ссылку.
     Узла-цели на странице нет — ссылка ведёт себя как обычная, секция цела. */
  var scrollToY = function (y) {
    var top = y < 0 ? 0 : y;
    try {
      window.scrollTo({ top: top, behavior: reduceMQ.matches ? 'auto' : 'smooth' });
    } catch (e) {
      window.scrollTo(0, top);
    }
  };

  var anchors = header.querySelectorAll('a[href^="#"]');
  Array.prototype.forEach.call(anchors, function (anchor) {
    anchor.addEventListener('click', function (event) {
      var id = (anchor.getAttribute('href') || '').slice(1);
      var top;

      if (!id || id === header.id) {
        top = 0;                                  /* логотип — наверх страницы */
      } else {
        var target = document.getElementById(id);
        if (!target) return;
        top = target.getBoundingClientRect().top
            + (window.pageYOffset || 0)
            - header.getBoundingClientRect().height;
      }

      event.preventDefault();
      scrollToY(top);
    });
  });

  /* ── 3. Номер телефона: копирование в буфер ──────────────────────────────
     Источник строки один — href="tel:" плашки телефона; видимая строка
     с пробелами живёт только в текстовом узле. Плашки на странице нет —
     работает запасное значение.
     Визуального подтверждения по брифу нет — отклик только для скринридера,
     через aria-live регион. Содержимое перед записью очищается: без этого второй
     клик подряд с тем же текстом не объявится. */
  var phoneButton = header.querySelector('.sw-header__contact--phone');
  if (phoneButton) {
    var phonePlate = header.querySelector('.sw-header__plate--phone');
    var phoneHref = phonePlate ? (phonePlate.getAttribute('href') || '') : '';
    var phoneValue = phoneHref.indexOf('tel:') === 0 ? phoneHref.slice(4) : '+79649387392';
    var status = header.querySelector('.sw-header__status');

    var announce = function (message) {
      if (!status) return;
      status.textContent = '';
      setTimeout(function () { status.textContent = message; }, 100);
    };

    phoneButton.addEventListener('click', function () {
      /* ANL: имя цели не назначено */
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(phoneValue).then(function () {
          announce('Номер телефона скопирован');
        }).catch(function () {});
      }
    });
  }

  /* ── 4. Активное состояние плашек на тач-устройствах ──────────────────────
     На iOS Safari :active не срабатывает без слушателя касания на самом
     элементе. Обработчик пустой: состояние рисует CSS. */
  var plates = header.querySelectorAll('.sw-header__plate');
  Array.prototype.forEach.call(plates, function (plate) {
    plate.addEventListener('touchstart', function () {}, { passive: true });
  });

  /* ── 5. Пункты меню: text-roll ────────────────────────────────────────────
     Библиотеки нет — секция тихо ничего не делает, пункты остаются обычными
     ссылками. registerPlugin здесь не вызывается: он один раз в блоке
     инициализации выше.
     Граница 769: ниже неё меню в панели нет, сплитить нечего. Значение обязано
     совпадать с границей появления меню в стилях секции — при её пересмотре
     правятся обе точки. Композиционная граница 1200 здесь ни при чём:
     она переключает только правую зону, где сплита нет.
     Слушатели — на самом <a>: при ре-сплите сгенерированные узлы
     пересоздаются и обработчики на них умирают (ANL-5). */
  var navLinks = header.querySelectorAll('.sw-header__nav-link');

  if (navLinks.length && window.gsap && window.SplitText) {

    var initTextRoll = function () {
      gsap.matchMedia().add(
        '(hover: hover) and (min-width: 769px) and (prefers-reduced-motion: no-preference)',
        function () {
          var teardown = [];

          Array.prototype.forEach.call(navLinks, function (link) {
            var base = link.querySelector('.sw-header__nav-text:not(.sw-header__nav-text--alt)');
            var alt = link.querySelector('.sw-header__nav-text--alt');
            if (!base || !alt) return;

            /* aria задаётся явно: элемент интерактивный, доступное имя ссылки
               уже стоит в aria-label и подменять его плагину нельзя. */
            var splitBase = SplitText.create(base, {
              type: 'chars', charsClass: 'sw-header__nav-char', aria: 'none'
            });
            var splitAlt = SplitText.create(alt, {
              type: 'chars', charsClass: 'sw-header__nav-char', aria: 'none'
            });

            /* Нижняя копия смещена на строку вниз своим CSS, поэтому обе
               копии едут в одну сторону: верхняя уходит вверх за границу
               строки, нижняя приходит на её место. Волна слева направо. */
            var roll = gsap.timeline({ paused: true })
              .to(splitBase.chars, { yPercent: -100, duration: 0.4, ease: 'power3.inOut', stagger: 0.03 }, 0)
              .to(splitAlt.chars, { yPercent: -100, duration: 0.4, ease: 'power3.inOut', stagger: 0.03 }, 0);

            var play = function () { roll.play(); };
            var back = function () { roll.reverse(); };

            link.addEventListener('mouseenter', play);
            link.addEventListener('mouseleave', back);

            teardown.push(function () {
              link.removeEventListener('mouseenter', play);
              link.removeEventListener('mouseleave', back);
              roll.kill();
              splitBase.revert();
              splitAlt.revert();
            });
          });

          return function () {
            teardown.forEach(function (undo) { undo(); });
          };
        }
      );
    };

    /* Сплит после готовности шрифта: при font-display: swap символы,
       посчитанные на фолбэк-шрифте, разъедутся в момент подмены на Inter. */
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(initTextRoll);
    } else {
      initTextRoll();
    }
  }

})();
</script>

<!-- ═══════ T123 · ПОВЕДЕНИЕ: Hero (SEC-1) ═══════ -->
<script>
/* поведение — секция Hero */
(function () {

  var hero = document.querySelector('.sw-hero');
  if (!hero) return;

  var reduceMQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* ── 1. Видео ─────────────────────────────────────────────────────────────
     Автоплей всегда и на всех ширинах — он объявлен атрибутом в разметке.
     Через CSS атрибут не отменяется, поэтому при prefers-reduced-motion: reduce
     воспроизведение снимается отсюда.
     Одного pause() мало: он оставил бы на экране застывший кадр. load()
     возвращает элемент в исходное состояние, и на месте видео снова виден
     постер — ровно то, что требуется. Атрибут снимается до load(), иначе
     воспроизведение стартовало бы заново.
     Библиотек секция не использует: анимаций появления и реакций на скролл
     в Hero нет, GSAP здесь не нужен. */
  var video = hero.querySelector('.sw-hero__video');

  if (video) {
    var stopVideo = function () {
      video.removeAttribute('autoplay');
      video.pause();
      video.load();
    };

    var startVideo = function () {
      var played = video.play();
      if (played && played.catch) played.catch(function () {});
    };

    if (reduceMQ.matches) stopVideo();

    /* Настройку системы можно переключить не перезагружая страницу. */
    if (reduceMQ.addEventListener) {
      reduceMQ.addEventListener('change', function () {
        if (reduceMQ.matches) stopVideo();
        else startVideo();
      });
    }
  }

  /* ── 2. Кнопка: якорь в форму ─────────────────────────────────────────────
     Механизм тот же, что у пунктов меню GlobalHeader: scroll-behavior задавался
     бы по корню документа, а это глобальное правило и в перенесённом коде оно
     запрещено.
     Компенсация высоты шапки берётся из собственного padding-top секции, а не
     из размеров .sw-header: значение по построению то же самое (высота панели
     плюс её нижний зазор), но секция при этом не обращается к чужому блоку и
     переживает его отсутствие.
     Узла-цели на странице нет — обработчик выходит, и ссылка ведёт себя как
     обычная. Секция цела. */
  var scrollToY = function (y) {
    var top = y < 0 ? 0 : y;
    try {
      window.scrollTo({ top: top, behavior: reduceMQ.matches ? 'auto' : 'smooth' });
    } catch (e) {
      window.scrollTo(0, top);
    }
  };

  var ctas = hero.querySelectorAll('.sw-hero__cta');

  Array.prototype.forEach.call(ctas, function (cta) {

    cta.addEventListener('click', function (event) {
      /* ANL: имя цели не назначено */
      var id = (cta.getAttribute('href') || '').slice(1);
      if (!id) return;

      var target = document.getElementById(id);
      if (!target) return;

      var compensation = parseFloat(window.getComputedStyle(hero).paddingTop) || 0;
      var top = target.getBoundingClientRect().top
              + (window.pageYOffset || 0)
              - compensation;

      event.preventDefault();
      scrollToY(top);
    });

    /* На iOS Safari :active не срабатывает без слушателя касания на самом
       элементе. Обработчик пустой: состояние рисует CSS. */
    cta.addEventListener('touchstart', function () {}, { passive: true });
  });

})();
</script>
